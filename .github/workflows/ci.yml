name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  
jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$GITHUB_SHA^"
          else
            base="${{ github.event.pull_request.base.sha }}"
          fi
          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if grep -Eq '^(core/|deploy/mysql/|scripts/lib/phase-0[13]/|\.planning/phases/03-)' <<<"$files"; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(web/|compose\.yaml|deploy/nginx/|scripts/verify-docker-release)' <<<"$files"; then
            echo 'web=true' >> "$GITHUB_OUTPUT"
          else
            echo 'web=false' >> "$GITHUB_OUTPUT"
          fi

  phase-01-portable:
    name: Phase 01 portable registry
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PHASE01_SERVICE_PLATFORM: linux/amd64
      PHASE01_MYSQL_IMAGE: mysql@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
      PHASE01_REDIS_IMAGE: redis@sha256:596405c58f60e287ce0d71459202aaff26d90d08590106264a5f4cc2c73308d2
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-out event commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare digest-pinned service images
        if: ${{ hashFiles('core/src/main/java/com/ycsopen/sms/core/common/security/FieldEncryptor.java', 'core/src/main/java/com/ycsopen/sms/core/common/security/HashUtil.java', 'core/src/test/java/com/ycsopen/sms/core/common/security/FieldEncryptorTest.java') != '' }}
        run: |
          /usr/bin/env ruby scripts/lib/phase-01/service_checks.rb prepare-images \
            --platform "$PHASE01_SERVICE_PLATFORM" \
            --mysql-image "$PHASE01_MYSQL_IMAGE" \
            --redis-image "$PHASE01_REDIS_IMAGE"
      - name: Execute shared portable verification registry
        if: ${{ hashFiles('core/src/main/java/com/ycsopen/sms/core/common/security/FieldEncryptor.java', 'core/src/main/java/com/ycsopen/sms/core/common/security/HashUtil.java', 'core/src/test/java/com/ycsopen/sms/core/common/security/FieldEncryptorTest.java') != '' }}
        run: >-
          ./scripts/verify-phase-01 --ci
          --evidence-dir
          .planning/phases/01-engineering-verification-foundation/EVIDENCE
      - name: Record Phase 1 lifecycle supersession
        if: ${{ hashFiles('core/src/main/java/com/ycsopen/sms/core/common/security/FieldEncryptor.java', 'core/src/main/java/com/ycsopen/sms/core/common/security/HashUtil.java', 'core/src/test/java/com/ycsopen/sms/core/common/security/FieldEncryptorTest.java') == '' }}
        run: echo 'phase01_portable_registry=SUPERSEDED_BY_PHASE03'
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-01-redacted-diagnostics-${{ github.run_id }}
          path: .planning/phases/01-engineering-verification-foundation/EVIDENCE/runs/
          if-no-files-found: warn
          retention-days: 3

  backend:
    name: Core / Java 21
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      # On pull_request, the default checkout target is GitHub's synthetic merge commit.
      - uses: actions/checkout@v4
      - name: Verify checked-out event commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Run backend tests
        run: mvn -f core/pom.xml test

  phase-03-portable-contracts:
    name: Phase 03 portable contracts
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-out event commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Install Phase 03 contract toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
      - name: Verify Flyway migration ownership
        run: |
          python3 skills/flyway-migration/tests/test_next_flyway_version.py
          python3 skills/flyway-migration/scripts/next_flyway_version.py \
            --owner crypto-storage-bootstrap --check V1202
      - name: Run destructive planning and protected-inventory fixtures
        run: |
          ruby .planning/tools/test-planning-validators.rb
          ruby .planning/tools/test-phase-03-protected-inventory.rb
          ruby scripts/lib/phase-03/test_service_checks.rb
      - name: Verify Issue 121 production UI evidence
        run: >-
          ruby .planning/tools/validate-change-ui-contract.rb
          --change issue-121-tenant-onboarding-access
      - name: Verify complaint management planning contracts
        run: |
          ruby .planning/tools/validate-prd-obligations.rb \
            --owner complaint-case-management --assert-unique --assert-traced
          ruby .planning/tools/validate-ui-contract.rb \
            --phase 41 --package complaint-case-management --stage design
          ruby .planning/tools/validate-ui-contract.rb \
            --phase 41 --package complaint-case-management --stage production
      - name: Audit production source reachability
        run: ruby scripts/lib/phase-03/run_checks.rb --internal-source-audit
      - name: Verify production artifact excludes test bridges
        run: |
          mvn -f core/pom.xml -DskipTests package
          if jar tf core/target/ycsopen-sms-core.jar | grep -E \
            'ProductionMigrationCommandServicesTestBridge|DockerMySqlSnapshotProcess'; then
            echo 'phase03_production_artifact=FAIL'
            exit 1
          fi
          echo 'phase03_production_artifact=PASS'

  phase-03-real-integration:
    name: Phase 03 real integration
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      PHASE03_SERVICE_PLATFORM: linux/amd64
      PHASE03_MYSQL_IMAGE: mysql@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
      PHASE03_MINIO_IMAGE: ycsopen/phase03-minio:RELEASE.2025-10-15T17-29-55Z
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-out event commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install real-integration system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake default-mysql-client libssl-dev
      - name: Install real-browser dependencies
        run: |
          npm --prefix web ci
          /usr/bin/google-chrome --version
      - name: Prepare real-integration service images
        run: |
          docker pull --platform "$PHASE03_SERVICE_PLATFORM" "$PHASE03_MYSQL_IMAGE"
          docker build --platform "$PHASE03_SERVICE_PLATFORM" \
            --build-arg MINIO_VERSION=RELEASE.2025-10-15T17-29-55Z \
            --tag "$PHASE03_MINIO_IMAGE" - <<'DOCKERFILE'
          FROM golang:1.24-alpine AS build
          ARG MINIO_VERSION
          RUN apk add --no-cache git
          RUN CGO_ENABLED=0 go install "github.com/minio/minio@${MINIO_VERSION}"
          RUN CGO_ENABLED=0 go install github.com/minio/mc@latest

          FROM alpine:3.22
          ARG MINIO_VERSION
          RUN apk add --no-cache curl
          COPY --from=build /go/bin/minio /usr/local/bin/minio
          COPY --from=build /go/bin/mc /usr/local/bin/mc
          LABEL version="${MINIO_VERSION}"
          ENTRYPOINT ["/usr/local/bin/minio"]
          DOCKERFILE
      - name: Run Phase 03 against MySQL, MinIO, and SoftHSM
        run: >-
          mvn -f core/pom.xml -Dphase03.integration.enabled=true
          -Dtest=Phase03FixturePreflightTest,Phase03ProtectedPersistenceIntegrationTest,Phase03Pkcs11IntegrationTest,Phase03MigrationIntegrationTest,Phase03ObjectStorageIntegrationTest,Phase03LeakScanIntegrationTest,Phase03RotationRecoveryIntegrationTest
          test
      - name: Run Issue 121 MySQL and real-service Chrome acceptance
        env:
          YCSOPEN_CHROME_PATH: /usr/bin/google-chrome
        run: |
          mvn -f core/pom.xml -Pphase01-integration -Dphase01.integration.enabled=true \
            -Dtest=Phase09TenantCredentialMySqlTest test
          mvn -f core/pom.xml -Pphase01-integration -Dphase01.integration.enabled=true \
            -Dtest=Phase08RealServicePlaywrightTest test
      - name: Prove every named real-integration suite executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          suites = (
              "Phase03FixturePreflightTest",
              "Phase03ProtectedPersistenceIntegrationTest",
              "Phase03Pkcs11IntegrationTest",
              "Phase03MigrationIntegrationTest",
              "Phase03ObjectStorageIntegrationTest",
              "Phase03LeakScanIntegrationTest",
              "Phase03RotationRecoveryIntegrationTest",
              "Phase09TenantCredentialMySqlTest",
              "Phase08RealServicePlaywrightTest",
          )
          report_root = Path("core/target/surefire-reports")
          failures = []
          for suite in suites:
              report = report_root / f"TEST-com.ycsopen.sms.core.verification.{suite}.xml"
              if not report.is_file():
                  failures.append(f"{suite}: report missing")
                  continue
              root = ET.parse(report).getroot()
              counts = {name: int(root.attrib.get(name, "0"))
                        for name in ("tests", "skipped", "failures", "errors")}
              if counts["tests"] < 1 or any(counts[name] != 0
                                             for name in ("skipped", "failures", "errors")):
                  failures.append(f"{suite}: {counts}")
          if failures:
              raise SystemExit("Phase 03 integration proof failed:\n" + "\n".join(failures))
          print(f"Executed {len(suites)} Phase 03 real-integration suites with zero skips.")
          PY
      - name: Clean owned integration services
        if: always()
        run: ruby scripts/lib/phase-03/service_checks.rb assert-clean --all
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-03-surefire-${{ github.run_id }}
          path: core/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web / Node 20
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-out event commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm --prefix web ci
      - name: Test frontend
        run: npm --prefix web test
      - name: Build frontend
        run: npm --prefix web run build

  docker-release:
    name: Docker release / Google Chrome
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checked-out pull-request head
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web acceptance dependencies
        run: npm --prefix web ci
      - name: Build Web assets for Docker image
        env:
          VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: npm --prefix web run build
      - name: Verify runner Google Chrome
        run: /usr/bin/google-chrome --version
      - name: Verify browser layout contracts
        env:
          YCSOPEN_CHROME_PATH: /usr/bin/google-chrome
        run: >-
          npm --prefix web run test:e2e --
          control-sizing.spec.ts issue-76-login-card.spec.ts
          --project=local-google-chrome --workers=1
      - name: Verify Issue 121 tenant onboarding and API access in Google Chrome
        env:
          YCSOPEN_CHROME_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_JSON_OUTPUT_NAME: issue-121-evidence/playwright-report.json
        run: >-
          npm --prefix web run test:e2e --
          issue-121-tenant-onboarding-access.spec.ts
          --project=local-google-chrome --workers=1 --reporter=line,json
      - name: Verify Issue 121 Chrome evidence
        run: test -s web/issue-121-evidence/playwright-report.json
      - name: Verify complaint management in Google Chrome
        env:
          YCSOPEN_CHROME_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_JSON_OUTPUT_NAME: complaint-case-evidence/playwright-report.json
        run: >-
          npm --prefix web run test:e2e --
          complaint-case.spec.ts --project=local-google-chrome
          --reporter=line,json
      - name: Verify complaint management Chrome evidence
        run: test -s web/complaint-case-evidence/playwright-report.json
      - name: Verify fresh and repeated Docker release
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
          YCSOPEN_CHROME_PATH: /usr/bin/google-chrome
        run: ./scripts/verify-docker-release
      - name: Upload Docker release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-${{ github.run_id }}
          path: |
            web/complaint-case-evidence/
            web/issue-121-evidence/
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14
