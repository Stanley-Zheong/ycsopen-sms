name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-01-portable:
    name: Phase 01 portable registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PHASE01_SERVICE_PLATFORM: linux/amd64
      PHASE01_MYSQL_IMAGE: mysql@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
      PHASE01_REDIS_IMAGE: redis@sha256:596405c58f60e287ce0d71459202aaff26d90d08590106264a5f4cc2c73308d2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Web flows
        run: npm run test:e2e
