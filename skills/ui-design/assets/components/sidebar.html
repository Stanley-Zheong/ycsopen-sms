<!--
  共享组件：左侧菜单
  用法：复制 <aside class="sidebar">...</aside> 整块到业务页面里，
  按阶段1的信息架构调整菜单项文案/链接，当前所在页面对应<a>加 class="active"。
  依赖 ../tokens.css（复制到项目里后请改成实际相对路径），以及 icons.svg。
-->
<style>
  .sidebar {
    width: var(--sidebar-width);
    background: var(--color-bg-card);
    border-right: 1px solid var(--color-border-light);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width .2s;
  }
  .sidebar.collapsed { width: var(--sidebar-width-collapsed); }
  .sidebar-logo {
    height: var(--header-height);
    display: flex;
    align-items: center;
    padding: 0 var(--space-4);
    font-size: var(--font-size-md);
    font-weight: 600;
    color: var(--color-text-1);
    border-bottom: 1px solid var(--color-border-light);
    white-space: nowrap;
    overflow: hidden;
  }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: var(--space-2) 0; }
  .sidebar-group-title {
    padding: var(--space-2) var(--space-4);
    font-size: var(--font-size-xs);
    color: var(--color-text-3);
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    height: 40px;
    padding: 0 var(--space-4);
    color: var(--color-text-2);
    font-size: var(--font-size-base);
    border-radius: var(--radius-sm);
    margin: 0 var(--space-2);
  }
  .sidebar-item:hover { background: var(--color-bg-block); color: var(--color-text-1); }
  .sidebar-item.active { background: var(--color-primary-bg); color: var(--color-primary); font-weight: 500; }
  .sidebar-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-item span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar.collapsed .sidebar-item span.label,
  .sidebar.collapsed .sidebar-group-title { display: none; }
</style>

<aside class="sidebar" data-testid="shared-console-shell-sidebar-region">
  <div class="sidebar-logo" data-testid="shared-console-shell-sidebar-brand">
    <span>产品名称</span>
  </div>
  <nav class="sidebar-nav" aria-label="主菜单" data-testid="shared-console-shell-sidebar-navigation">
    <div class="sidebar-group-title">工作台</div>
    <a class="sidebar-item active" href="dashboard.html" aria-current="page" data-testid="shared-console-shell-sidebar-dashboard-link">
      <svg class="icon"><use href="../components/icons.svg#icon-batch"/></svg>
      <span class="label">首页工作台</span>
    </a>

    <div class="sidebar-group-title">业务模块（按实际拆解替换）</div>
    <a class="sidebar-item" href="order-list.html" data-testid="shared-console-shell-sidebar-module-one-link">
      <svg class="icon"><use href="../components/icons.svg#icon-filter"/></svg>
      <span class="label">模块一</span>
    </a>
    <a class="sidebar-item" href="#" data-testid="shared-console-shell-sidebar-module-two-link">
      <svg class="icon"><use href="../components/icons.svg#icon-user"/></svg>
      <span class="label">模块二</span>
    </a>

    <div class="sidebar-group-title">系统</div>
    <a class="sidebar-item" href="#" data-testid="shared-console-shell-sidebar-notification-settings-link">
      <svg class="icon"><use href="../components/icons.svg#icon-bell"/></svg>
      <span class="label">通知与集成设置</span>
    </a>
    <a class="sidebar-item" href="#" data-testid="shared-console-shell-sidebar-user-permission-link">
      <svg class="icon"><use href="../components/icons.svg#icon-user"/></svg>
      <span class="label">用户与权限</span>
    </a>
  </nav>
</aside>
