<!--
  共享组件：顶部Header（面包屑 + 全局操作 + 通知 + 用户信息）
  依赖 icons.svg 和 user-profile-popover.html（头像点击展开的下拉内容）
-->
<style>
  .header {
    height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-6);
    background: var(--color-bg-card);
    border-bottom: 1px solid var(--color-border-light);
    flex-shrink: 0;
  }
  .header-breadcrumb { font-size: var(--font-size-base); color: var(--color-text-3); }
  .header-breadcrumb .current { color: var(--color-text-1); font-weight: 500; }
  .header-actions { display: flex; align-items: center; gap: var(--space-4); }
  .header-icon-btn {
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-text-2); cursor: pointer; position: relative;
    border: 0; background: transparent;
  }
  .header-icon-btn:hover { background: var(--color-bg-block); }
  .header-icon-btn .icon { width: 18px; height: 18px; }
  .header-badge {
    position: absolute; top: 2px; right: 2px; width: 8px; height: 8px;
    background: var(--color-danger); border-radius: 50%;
  }
  .header-user { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; padding: 4px 8px; border: 0; border-radius: var(--radius-sm); background: transparent; color: inherit; }
  .header-user:hover { background: var(--color-bg-block); }
  .header-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--color-primary-bg);
    color: var(--color-primary); display: flex; align-items: center; justify-content: center;
    font-size: var(--font-size-sm); font-weight: 600;
  }
</style>

<header class="header" data-testid="shared-console-shell-header-region">
  <nav class="header-breadcrumb" aria-label="面包屑" data-testid="shared-console-shell-header-breadcrumb">
    模块名称 / <span class="current">当前页面名称</span>
  </nav>
  <div class="header-actions">
    <button class="header-icon-btn" type="button" aria-label="打开通知中心" data-testid="shared-console-shell-header-notification-button">
      <svg class="icon"><use href="../components/icons.svg#icon-bell"/></svg>
      <span class="header-badge" data-testid="shared-console-shell-header-notification-unread-indicator"></span>
    </button>
    <!-- 点击后弹出 user-profile-popover.html 的内容 -->
    <button class="header-user" type="button" aria-haspopup="menu" aria-expanded="false" data-testid="shared-console-shell-header-profile-button">
      <div class="header-avatar">张</div>
      <span>张三 · 管理员</span>
      <svg class="icon" style="width:14px;height:14px;"><use href="../components/icons.svg#icon-chevron-down"/></svg>
    </button>
  </div>
</header>
