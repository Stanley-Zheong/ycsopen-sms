<!--
  共享组件：用户状态弹出框（点击 header 里的头像后展开）
  标准内容：用户信息、切换角色、消息/IM通知设置入口、退出登录
-->
<style>
  .user-popover {
    width: 260px;
    background: var(--color-bg-card);
    border: 1px solid var(--color-border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: var(--space-4);
  }
  .user-popover-header { display: flex; align-items: center; gap: var(--space-3); padding-bottom: var(--space-4); border-bottom: 1px solid var(--color-border-light); }
  .user-popover-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--color-primary-bg); color: var(--color-primary); display:flex;align-items:center;justify-content:center;font-weight:600; }
  .user-popover-name { font-size: var(--font-size-base); color: var(--color-text-1); font-weight: 500; }
  .user-popover-role { font-size: var(--font-size-xs); color: var(--color-text-3); }
  .user-popover-menu { padding-top: var(--space-2); }
  .user-popover-item {
    display: flex; align-items: center; gap: var(--space-2);
    height: 36px; padding: 0 var(--space-2); border-radius: var(--radius-sm);
    color: var(--color-text-2); font-size: var(--font-size-base); cursor: pointer;
    width: 100%; border: 0; background: transparent; text-align: left;
  }
  .user-popover-item:hover { background: var(--color-bg-block); }
  .user-popover-item.danger { color: var(--color-danger); }
  .user-popover-item .icon { width: 16px; height: 16px; }
  .user-popover-divider { height: 1px; background: var(--color-border-light); margin: var(--space-2) 0; }
</style>

<div class="user-popover" role="menu" data-testid="shared-console-profile-popover-menu">
  <div class="user-popover-header">
    <div class="user-popover-avatar">张</div>
    <div>
      <div class="user-popover-name">张三</div>
      <div class="user-popover-role">管理员 · 运营部</div>
    </div>
  </div>
  <div class="user-popover-menu">
    <button class="user-popover-item" type="button" role="menuitem" data-testid="shared-console-profile-popover-profile-button">
      <svg class="icon"><use href="../components/icons.svg#icon-user"/></svg>
      <span>个人信息</span>
    </button>
    <button class="user-popover-item" type="button" role="menuitem" data-testid="shared-console-profile-popover-switch-role-button">
      <svg class="icon"><use href="../components/icons.svg#icon-chevron-down"/></svg>
      <span>切换角色（如有多角色）</span>
    </button>
    <button class="user-popover-item" type="button" role="menuitem" data-testid="shared-console-profile-popover-notification-settings-button">
      <svg class="icon"><use href="../components/icons.svg#icon-chat"/></svg>
      <span>消息与IM绑定设置</span>
    </button>
    <div class="user-popover-divider"></div>
    <button class="user-popover-item danger" type="button" role="menuitem" data-testid="shared-console-profile-popover-logout-button">
      <svg class="icon"><use href="../components/icons.svg#icon-logout"/></svg>
      <span>退出登录</span>
    </button>
  </div>
</div>
