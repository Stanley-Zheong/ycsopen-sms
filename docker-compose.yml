services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ycsopen_sms
      MYSQL_USER: ycsopen
      MYSQL_PASSWORD: ycsopen
      MYSQL_ROOT_PASSWORD: local-root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--log-bin-trust-function-creators=ON"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plocal-root"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_USERNAME: ycsopen
      DB_PASSWORD: ycsopen
      DB_MIGRATION_USERNAME: ycsopen_migrator
      DB_MIGRATION_PASSWORD: ycsopen_migrator
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ycsopen_sms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      REDIS_HOST: redis
      JWT_SECRET: local-only-change-me-please-32-bytes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: web
      dockerfile: Dockerfile
    depends_on:
      - core
    ports:
      - "8088:80"

volumes:
  mysql-data:
