<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YCS Open SMS Console Prototype</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    :root {
      --brand: var(--color-brand); --brand-dark: var(--color-brand-dark); --accent: var(--color-accent);
      --page: var(--color-page); --surface: var(--color-surface); --surface-alt: var(--color-surface-alt);
      --text: var(--color-text); --muted: var(--color-muted); --border: var(--color-border);
      --success: var(--color-success); --warning: var(--color-warning); --danger: var(--color-danger);
      --shadow: 0 12px 34px var(--color-shadow);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text); background: var(--page);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1100px; background: var(--page); }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--color-focus); outline-offset: 2px;
    }
    .skip { position: fixed; left: 16px; top: -60px; z-index: 100; background: var(--color-surface); padding: 10px 14px; border-radius: 6px; }
    .skip:focus { top: 12px; }
    .app { min-height: 100vh; display: grid; grid-template-rows: 68px 1fr; }
    .header { background: var(--brand-dark); color: var(--color-surface); display: flex; align-items: center; gap: 18px; padding: 0 24px; position: sticky; top: 0; z-index: 30; }
    .brand { font-weight: 800; letter-spacing: .5px; white-space: nowrap; }
    .environment, .role-badge { border-radius: 999px; font-size: 12px; font-weight: 700; padding: 5px 9px; }
    .environment { background: var(--color-header-muted); color: var(--color-header-label); }
    .role-badge { background: var(--color-success-bg); color: var(--success); }
    .header-spacer { flex: 1; }
    .header-search { width: 270px; color: var(--color-surface); background: var(--color-header-muted); border: 1px solid var(--color-header-border); border-radius: 6px; padding: 9px 12px; }
    .icon-button { border: 0; border-radius: 7px; background: transparent; color: inherit; padding: 9px; cursor: pointer; }
    .icon-button:hover { background: rgba(255,255,255,.1); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--color-brand-dark); display: grid; place-items: center; font-weight: 800; }
    .body { display: grid; grid-template-columns: 242px 1fr; min-height: calc(100vh - 68px); }
    .sidebar { background: var(--color-surface); border-right: 1px solid var(--border); padding: 20px 14px; overflow: auto; max-height: calc(100vh - 68px); position: sticky; top: 68px; }
    .nav-heading { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; margin: 14px 10px 7px; text-transform: uppercase; }
    .nav-link { display: block; color: var(--muted); text-decoration: none; font-size: 13px; padding: 9px 10px; margin: 2px 0; border-radius: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .nav-link:hover { background: var(--color-nav-hover); color: var(--text); }
    .nav-link[aria-current="page"] { background: var(--surface-alt); color: var(--brand); font-weight: 700; }
    .main { padding: 28px 32px 42px; overflow: hidden; }
    .breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 13px; }
    .contract-badges { display: flex; flex-wrap: wrap; gap: 7px; margin: -8px 0 16px; }
    .contract-badge { display: inline-flex; border: 1px solid var(--color-contract-border); border-radius: 999px; background: var(--color-contract-bg); color: var(--brand); padding: 5px 9px; font-size: 11px; font-weight: 700; }
    .page-heading { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
    .page-heading-text { flex: 1; }
    h1 { font-size: 27px; line-height: 1.2; margin: 0 0 6px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    .button { border: 1px solid var(--border); background: var(--color-surface); color: var(--text); border-radius: 5px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
    .button:hover { border-color: var(--color-hover-border); background: var(--color-chart-bg); }
    .button.primary { background: var(--brand); border-color: var(--brand); color: var(--color-surface); }
    .button.danger { background: var(--color-danger); border-color: var(--color-danger); color: var(--color-surface); }
    .button:disabled { color: var(--color-disabled-text); background: var(--color-disabled-bg); border-color: var(--color-disabled-border); cursor: not-allowed; }
    .toolbar { display: flex; align-items: center; gap: 10px; background: var(--color-surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px; margin-bottom: 16px; }
    .toolbar input, .toolbar select, .field { border: 1px solid var(--border); border-radius: 6px; background: var(--color-surface); color: var(--text); padding: 9px 11px; }
    .toolbar input { min-width: 260px; }
    .toolbar-spacer { flex: 1; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
    .card { background: var(--color-surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 2px 7px rgba(18,50,80,.03); }
    .metric { padding: 18px; }
    .metric-label { color: var(--muted); font-size: 13px; }
    .metric-value { font-size: 25px; font-weight: 800; margin: 9px 0 5px; }
    .metric-trend { color: var(--success); font-size: 12px; }
    .table-card { overflow: hidden; }
    .table-head { display: flex; align-items: center; padding: 17px 18px; border-bottom: 1px solid var(--border); }
    .table-head h2 { font-size: 16px; margin: 0; flex: 1; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--muted); background: var(--color-table-header); font-size: 12px; padding: 11px 14px; }
    td { padding: 13px 14px; border-top: 1px solid var(--color-row-border); font-size: 13px; }
    tr:hover td { background: var(--color-row-hover); }
    .status { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 700; }
    .status.success { background: var(--color-success-bg); color: var(--success); }
    .status.warning { background: var(--color-warning-bg); color: var(--warning); }
    .pagination { display: flex; justify-content: flex-end; gap: 8px; align-items: center; padding: 13px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(18,50,80,.42); display: grid; place-items: center; }
    .dialog { width: 480px; background: var(--color-surface); border-radius: 12px; box-shadow: var(--shadow); padding: 22px; }
    .dialog h2 { margin: 0 0 10px; font-size: 20px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .drawer { position: fixed; right: 0; top: 68px; bottom: 0; width: 390px; z-index: 48; background: var(--color-surface); box-shadow: var(--shadow); padding: 20px; }
    .drawer-head { display: flex; align-items: center; margin-bottom: 14px; }
    .drawer-head h2 { flex: 1; margin: 0; font-size: 18px; }
    .notice { padding: 13px 2px; border-bottom: 1px solid var(--border); }
    .notice strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .notice small { color: var(--muted); }
    .popover { position: fixed; right: 24px; top: 60px; z-index: 49; width: 210px; background: var(--color-surface); color: var(--text); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow); padding: 8px; }
    .popover button { width: 100%; border: 0; background: transparent; text-align: left; padding: 10px; border-radius: 5px; cursor: pointer; }
    .popover button:hover { background: var(--color-popover-hover); }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 70; background: var(--brand-dark); color: var(--color-surface); border-radius: 8px; padding: 12px 16px; box-shadow: var(--shadow); }
    .empty { min-height: 510px; display: grid; place-items: center; text-align: center; }
    .empty-illustration { width: 112px; height: 112px; margin: 0 auto 18px; border-radius: 56px; background: var(--color-empty-bg); color: var(--brand); display: grid; place-items: center; }
    .empty-illustration svg { width: 52px; height: 52px; }
    .empty h2 { margin: 0 0 8px; }
    .empty p { color: var(--muted); margin: 0 0 18px; }
    .form-card { max-width: 760px; padding: 24px; }
    .form-card h2 { margin-top: 0; }
    .form-row { display: grid; gap: 7px; margin: 17px 0; }
    .form-row label { font-size: 13px; font-weight: 700; }
    textarea.field { min-height: 110px; resize: vertical; }
    .field[aria-invalid="true"] { border: 2px solid var(--color-danger); }
    .error { margin: 0; color: var(--danger); background: var(--color-error-bg); border-radius: 6px; padding: 9px 10px; font-size: 13px; }
    .state-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .portal-map { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .portal-card { padding: 18px; }
    .portal-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .portal-card-head h2 { flex: 1; margin: 0; font-size: 16px; }
    .portal-links { display: flex; flex-wrap: wrap; gap: 7px; }
    .portal-link { border-radius: 5px; background: var(--color-page); color: var(--muted); padding: 7px 9px; font-size: 12px; }
    .state-card { padding: 18px; min-height: 150px; }
    .state-card h3 { margin: 0 0 9px; font-size: 15px; }
    .state-card p { color: var(--muted); font-size: 13px; }
    .skeleton { height: 11px; border-radius: 8px; background: linear-gradient(90deg,var(--color-skeleton),var(--color-table-header),var(--color-skeleton)); margin: 10px 0; }
    .chart { height: 200px; display: flex; gap: 10px; align-items: flex-end; padding: 20px; background: var(--color-chart-bg); border-radius: 8px; }
    .bar { flex: 1; background: var(--brand); border-radius: 4px 4px 0 0; }
    .auth-shell { min-height: 100vh; display: grid; grid-template-columns: 1.15fr .85fr; }
    .auth-brand { padding: 72px; color: var(--color-surface); background: linear-gradient(145deg,var(--color-brand-dark),var(--color-brand)); display: flex; flex-direction: column; justify-content: center; }
    .auth-brand h1 { font-size: 42px; }
    .auth-panel { display: grid; place-items: center; padding: 60px; }
    .auth-card { width: 390px; padding: 28px; }
    .auth-card .field { width: 100%; }
    .auth-card .button { width: 100%; margin-top: 10px; }
    [hidden] { display: none !important; }
    @media (max-width: 1180px) {
      .body { grid-template-columns: 210px 1fr; }
      .main { padding: 24px; }
      .metrics { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>

      document.querySelector("[data-testid='shared-console-shell-notification-drawer']")?.remove();
      const drawer = document.createElement("aside");
      drawer.className = "drawer"; drawer.dataset.testid = "shared-console-shell-notification-drawer"; drawer.setAttribute("aria-label","通知中心");
      drawer.innerHTML = `<div class="drawer-head"><h2>通知中心</h2><button class="icon-button" type="button" data-testid="shared-console-shell-notification-drawer-close-action" aria-label="关闭通知中心">✕</button></div><article class="notice"><strong>通道成功率恢复正常</strong><small>刚刚</small></article><article class="notice"><strong>模板审核已完成</strong><small>10 分钟前</small></article>`;
      document.body.appendChild(drawer);
      drawer.querySelector("button").focus();
      drawer.querySelector("button").addEventListener("click", () => { drawer.remove(); document.querySelector("[data-testid='shared-console-shell-header-notification-trigger']")?.focus(); });
    }
    function toggleProfile() {
      const existing = document.querySelector("[data-testid='shared-console-shell-profile-popover']");
      if (existing) { existing.remove(); return; }
      const popover = document.createElement("div");
      popover.className = "popover"; popover.dataset.testid = "shared-console-shell-profile-popover";
      popover.innerHTML = `<button type="button" data-testid="shared-console-shell-profile-personal-action">个人资料</button><button type="button" data-testid="shared-console-shell-profile-security-action">安全设置</button><button type="button" data-testid="shared-console-shell-profile-logout-action">退出登录</button>`;
      document.body.appendChild(popover);
      popover.querySelector("button").focus();
    }
    function openDialog(trigger) {
      const overlay = document.createElement("div");
      overlay.className = "overlay"; overlay.dataset.testid = "shared-console-shell-record-dialog-overlay";
      overlay.innerHTML = `<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="shared-console-shell-record-dialog-title" data-testid="shared-console-shell-record-dialog"><h2 id="shared-console-shell-record-dialog-title">记录详情</h2><p>该记录已绑定操作者、状态变更时间和审计链路。</p><div class="dialog-actions"><button class="button" type="button" data-testid="shared-console-shell-record-dialog-close-action">关闭</button><button class="button primary" type="button" data-testid="shared-console-shell-record-dialog-confirm-action">确认</button></div></section>`;
      document.body.appendChild(overlay);
      const close = () => { overlay.remove(); trigger?.focus(); };
      overlay.querySelector("[data-testid='shared-console-shell-record-dialog-close-action']").addEventListener("click", close);
      overlay.querySelector("[data-testid='shared-console-shell-record-dialog-confirm-action']").addEventListener("click", () => { close(); toast("操作已确认"); });
      overlay.querySelector("[data-testid='shared-console-shell-record-dialog-close-action']").focus();
    }
    function bindInteractions() {
      document.querySelectorAll("[data-route-link]").forEach((link) => link.addEventListener("click", (event) => {
        event.preventDefault(); history.pushState({}, "", link.getAttribute("href")); render();
      }));
      document.querySelector("[data-testid='shared-console-shell-header-notification-trigger']")?.addEventListener("click", openDrawer);
      document.querySelector("[data-testid='shared-console-shell-header-profile-trigger']")?.addEventListener("click", toggleProfile);
      document.querySelector("[data-testid='shared-console-shell-header-role-switcher']")?.addEventListener("change", (event) => {
        const item = routeByPath.get(window.location.pathname) || ROUTES[0];
        const scope = scopeFor(item);
        selectedRoleByScope[scope] = event.target.value;
        rolePinnedByScope[scope] = true;
        render();
      });
      document.querySelectorAll("[data-testid='shared-console-shell-toolbar-refresh-action'],[data-testid='shared-console-shell-toolbar-export-action'],[data-testid='shared-console-shell-page-primary-action'],[data-testid='shared-console-shell-toolbar-primary-action'],[data-testid='shared-console-design-list-empty-create-action']").forEach((button) => button.addEventListener("click", () => toast("操作已完成")));
      document.querySelectorAll("[data-testid='shared-console-shell-records-row-detail-action'],[data-testid='shared-console-shell-records-row-review-action']").forEach((button) => button.addEventListener("click", (event) => openDialog(event.currentTarget)));
      const search = document.querySelector("[data-testid='shared-console-shell-toolbar-keyword-search']");
      search?.addEventListener("input", () => {
        document.querySelectorAll("[data-testid^='shared-console-shell-records-row-']").forEach((row) => { row.hidden = !row.textContent.includes(search.value); });
      });
      const form = document.querySelector("[data-testid='shared-console-design-form-review-form']");
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        const field = document.querySelector("[data-testid='shared-console-design-form-review-reason-input']");
        const error = document.querySelector("[data-testid='shared-console-design-form-review-reason-error']");
        const submit = document.querySelector("[data-testid='shared-console-design-form-review-submit-action']");
        if (field.value.trim().length < 5) {
          field.setAttribute("aria-invalid","true");
          error.textContent = "请输入不少于 5 个字的驳回原因"; error.hidden = false;
          submit.disabled = true; field.focus(); return;
        }
        field.removeAttribute("aria-invalid"); error.hidden = true; toast("审核结果已提交");
      });
      document.querySelector("[data-testid='shared-console-design-form-review-reason-input']")?.addEventListener("input", (event) => {
        const submit = document.querySelector("[data-testid='shared-console-design-form-review-submit-action']");
        submit.disabled = event.target.value.trim().length < 5;
      });
      document.querySelector("[data-testid='shared-auth-login-form-region']")?.addEventListener("submit", (event) => { event.preventDefault(); toast("原型环境不执行真实登录"); });
    }
    window.addEventListener("popstate", () => render());
    render();
  </script>
</body>
</html>
