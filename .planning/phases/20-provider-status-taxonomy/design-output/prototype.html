<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Phase 20 Provider Status Taxonomy Prototype</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fb; color: #101828; }
    main { padding: 24px; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid #eaecf0; border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #eaecf0; padding: 10px; text-align: left; }
    button, input, select, textarea { border: 1px solid #d0d5dd; border-radius: 8px; padding: 8px 10px; }
  </style>
</head>
<body>
  <main data-route="/admin/status-codes" data-testid="admin-provider-status-taxonomy-status-codes-page">
    <section class="card">
      <h1>供应商状态码归一化</h1>
      <p>维护 provider/protocol/code 到平台语义的一套有效映射。</p>
      <input data-testid="admin-provider-status-taxonomy-status-codes-version" value="ST20260909">
      <textarea data-testid="admin-provider-status-taxonomy-status-codes-import-input">YTO,HTTP,DELIVRD,SUCCESS,true,true,false,INFO,确认送达</textarea>
      <button data-testid="admin-provider-status-taxonomy-status-codes-import">导入状态码</button>
      <button data-testid="admin-provider-status-taxonomy-status-codes-export">请求导出</button>
    </section>
    <section class="card">
      <h2>归一化试算</h2>
      <input data-testid="admin-provider-status-taxonomy-provider" value="YTO">
      <select data-testid="admin-provider-status-taxonomy-protocol"><option>HTTP</option><option>CMPP</option></select>
      <input data-testid="admin-provider-status-taxonomy-provider-code" value="DELIVRD">
      <button data-testid="admin-provider-status-taxonomy-normalize">归一化</button>
      <div data-testid="admin-provider-status-taxonomy-normalized-result">SUCCESS / final=true / billable=true / retry=false</div>
      <span data-testid="admin-provider-status-taxonomy-unknown-fallback">UNKNOWN_SAFE_FALLBACK</span>
    </section>
    <section class="card" data-testid="admin-provider-status-status-codes-version-history">
      <h2>版本历史</h2>
      <table><tbody><tr data-testid="admin-provider-status-taxonomy-status-codes-version-row"><td>ST20260909</td><td>ACTIVE</td><td>供应商文档</td></tr></tbody></table>
    </section>
    <section class="card">
      <h2>当前映射</h2>
      <table data-testid="admin-provider-status-taxonomy-status-codes-table"><tbody><tr data-testid="admin-provider-status-taxonomy-status-codes-row"><td>YTO</td><td>HTTP</td><td>DELIVRD</td><td>SUCCESS</td></tr></tbody></table>
    </section>
  </main>
</body>
</html>
