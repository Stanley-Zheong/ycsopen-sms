<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>Phase19 号码归属</title></head>
  <body>
    <nav aria-label="Phase19 routes">/admin/number-attribution /admin/number-portability /admin/prefixes</nav>
    <main data-testid="admin-number-attribution-portability-attribution-page">
      <section data-testid="admin-number-attribution-portability-prefixes-page">

        <select data-testid="admin-prefixes-update-type"></select>
