<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Phase 12 Signature Lifecycle Prototype</title>
  <meta name="routes" content="/tenant/signatures,/admin/signatures/review" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8fb; color: #162033; margin: 0; padding: 24px; }
    .card { background: #fff; border: 1px solid #e5eaf3; border-radius: 12px; padding: 16px; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #edf1f7; padding: 10px; text-align: left; }
    button { border: 0; border-radius: 8px; background: #2454d6; color: white; padding: 8px 12px; }
  </style>
</head>
<body>
  <section data-testid="tenant-signature-lifecycle-signatures-page">
    <h1>签名管理</h1>
    <form class="card" data-testid="tenant-signature-lifecycle-signatures-application-form">
      <input aria-label="签名内容" value="优创硕安" />
      <select aria-label="签名类型"><option>TRADEMARK</option></select>
      <input aria-label="证明材料" value="pobj-proof-1" />
      <button type="button" data-testid="tenant-signature-lifecycle-signatures-application-submit">提交申请</button>
    </form>
    <div class="card" data-testid="tenant-signature-lifecycle-signatures-history">SUBMITTED / APPROVED</div>
    <button type="button" data-testid="tenant-signature-lifecycle-signatures-usable-channels">查看可用通道</button>
  </section>
  <section data-testid="admin-signature-lifecycle-signature-review-page">
    <h1>签名审核</h1>
    <div class="card" data-testid="admin-signature-lifecycle-signature-review-stats">总数 1 / 待审核 1 / 高风险 1</div>
    <input data-testid="admin-signature-lifecycle-signature-review-filters" value="优创" />
    <table>
      <tr data-testid="admin-signature-lifecycle-signature-review-row">
        <td>优创硕安</td>
        <td><button type="button" data-testid="admin-signature-lifecycle-signature-review-decision-open">审核</button></td>
      </tr>
    </table>
    <button type="button" data-testid="admin-signature-lifecycle-signature-review-decision">通过</button>
    <div class="card" data-testid="admin-signature-lifecycle-signature-filing-matrix">cmpp-main / NONE</div>
    <button type="button" data-testid="admin-signature-lifecycle-signature-filing-retry">提交/重试报备</button>
    <button type="button" data-testid="admin-signature-lifecycle-signature-filing-result-registered">记录已报备</button>
  </section>
</body>
</html>
