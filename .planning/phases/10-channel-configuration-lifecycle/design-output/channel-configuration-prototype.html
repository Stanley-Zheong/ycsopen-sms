<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>通道配置 · 原型</title>
  <style>
    :root { --blue:#0C85E8; --teal:#31C9B6; --page:#F6FAFF; --text:#123250; --muted:#5F7389; --border:#DBE5EF; --danger:#E5484D; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:var(--page); font:14px "Segoe UI","PingFang SC",sans-serif; }
    header { height:60px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 28px; }
    aside { position:fixed; top:60px; bottom:0; width:232px; background:#fff; border-right:1px solid var(--border); padding:24px 16px; }
    main { margin-left:232px; padding:28px 32px; } .crumb { color:var(--muted); margin-bottom:8px; }
    .toolbar,.card { background:#fff; border:1px solid var(--border); border-radius:8px; padding:20px; } .toolbar { display:flex; gap:12px; align-items:center; margin:16px 0; }
    button { border:0; border-radius:4px; padding:9px 14px; background:var(--blue); color:#fff; cursor:pointer; } button.secondary { background:#eef5ff;color:var(--blue); } button.danger { background:var(--danger); }
    input,select { border:1px solid var(--border); border-radius:4px; padding:8px; color:var(--text); } label { display:grid; gap:6px; }
    table { width:100%; border-collapse:collapse; } th,td { padding:12px 10px; border-bottom:1px solid var(--border); text-align:left; } th { color:var(--muted); font-weight:600; }
    .status { color:#0D8779; background:#E7F8F4; border-radius:99px; padding:4px 8px; } dialog { border:1px solid var(--border); border-radius:10px; width:680px; padding:24px; } dialog::backdrop { background:#12325055; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } .notice { background:#eef5ff; border-left:3px solid var(--blue); padding:12px; margin:12px 0; }
  </style>
</head>
<body>
  <header><strong>YCSOpen SMS</strong><span style="margin-left:auto">运营控制台　通道配置</span></header>
  <aside><div>控制台概览</div><div style="margin-top:16px;color:var(--blue)" aria-current="page">通道配置</div><div style="margin-top:16px">审核中心</div></aside>
  <main data-route="/admin/channel/configuration">
    <div class="crumb">首页 / 通道管理 / 配置</div>
    <section class="card" data-testid="admin-channel-configuration-channel-configuration-page">
      <h1>通道配置</h1>
      <div class="toolbar"><input aria-label="搜索通道" placeholder="通道名称/协议" /><select aria-label="状态"><option>全部状态</option><option>正常</option><option>已下线</option></select><button class="secondary">刷新</button><button onclick="document.querySelector('dialog').showModal()">新建通道</button></div>
      <table><thead><tr><th>通道名称</th><th>协议</th><th>运营商</th><th>生效版本</th><th>单价</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead><tbody>
        <tr data-testid="admin-channel-configuration-channel-row" data-channel-key="prototype-channel"><td>演示通道</td><td>CMPP</td><td>移动</td><td>v3</td><td>0.0300</td><td>50</td><td><span class="status">正常</span></td><td><button class="secondary">编辑</button><button class="secondary" data-testid="admin-channel-configuration-channel-configuration-connectivity-test">连通性测试</button><button class="secondary" data-testid="admin-channel-configuration-channel-configuration-activation-result">激活结果</button><button class="secondary" data-testid="admin-channel-configuration-channel-dependency-preview">依赖预览</button><button class="secondary" data-testid="admin-channel-configuration-channel-migration-wizard">迁移向导</button><button class="danger" data-testid="admin-channel-configuration-channel-offline">下线</button></td></tr>
      </tbody></table>
      <div class="notice" role="status">当前生效版本 v3，最近更新已审计</div>
    </section>
    <dialog aria-labelledby="dialog-title"><h2 id="dialog-title">新建通道</h2><form method="dialog"><div class="grid">
      <label>通道名称<input required maxlength="50" data-testid="admin-channel-configuration-channel-form-name" /></label>
      <label>协议<select required data-testid="admin-channel-configuration-channel-form-protocol"><option>CMPP</option><option>SGIP</option><option>SMGP</option><option>HTTP</option></select></label>
      <label>接入地址/端口<input placeholder="host:port" data-testid="admin-channel-configuration-channel-form-endpoint" /></label>
      <label>账号/密码<input type="password" placeholder="仅写入，不回显" data-testid="admin-channel-configuration-channel-form-credential" /></label>
      <label>连接数/窗口<input type="number" min="1" data-testid="admin-channel-configuration-channel-form-connection" /></label>
      <label>单价<input type="number" min="0" step="0.0001" data-testid="admin-channel-configuration-channel-form-price" /><span data-testid="admin-channel-configuration-channel-configuration-price">阶梯价/分省价按版本保存</span></label>
      <label>优先级<input type="number" min="1" max="100" value="50" data-testid="admin-channel-configuration-channel-form-priority" /></label>
    </div><p><button type="button" class="secondary" data-testid="admin-channel-configuration-channel-configuration-connectivity-test">测试连通性</button><button type="submit">保存草稿</button></p></form></dialog>
  </main>
</body>
</html>
