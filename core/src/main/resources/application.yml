spring:
  application:
    name: ycsopen-sms-core
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

ycsopen:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_IN_ENV_32_BYTES_MINIMUM}
      access-token-ttl-minutes: 120
    field-encryption:
      # AES key for 🔒-tagged column encryption (PRD 6.2.1). MUST come from a
      # real KMS in production — env var here is a dev-only placeholder.
      key-base64: ${FIELD_ENCRYPTION_KEY:CHANGE_ME_BASE64_32_BYTES}
  routing:
    complaint-ratio-threshold: 0.003   # 千分之三 default, see PRD F-11.9/F-11.10
  third-party-blacklist:
    enabled: false
    base-url: ${THIRD_PARTY_BLACKLIST_URL:}
    app-id: ${THIRD_PARTY_BLACKLIST_APP_ID:}
    timeout-ms: 800
    fail-open: true   # F-5.3 超时降级策略：默认放行，避免外部依赖拖垮主链路

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
