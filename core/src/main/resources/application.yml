spring:
  application:
    name: ycsopen-sms-core
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

ycsopen:
  object-store:
    enabled: ${YCSOPEN_OBJECT_STORE_ENABLED:false}
    bucket: ${YCSOPEN_OBJECT_STORE_BUCKET:}
    region: ${YCSOPEN_OBJECT_STORE_REGION:}
    endpoint: ${YCSOPEN_OBJECT_STORE_ENDPOINT:}
    allowed-endpoints: ${YCSOPEN_OBJECT_STORE_ALLOWED_ENDPOINTS:}
    credential-provider: ${YCSOPEN_OBJECT_STORE_CREDENTIAL_PROVIDER:DEFAULT_CHAIN}
    path-style-access: ${YCSOPEN_OBJECT_STORE_PATH_STYLE_ACCESS:false}
    allow-insecure-loopback: false
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_IN_ENV_32_BYTES_MINIMUM}
      access-token-ttl-minutes: 120
    crypto-storage:
      enabled: ${YCSOPEN_CRYPTO_STORAGE_ENABLED:false}
      adapter: ${YCSOPEN_CRYPTO_STORAGE_ADAPTER:SUN_PKCS11}
      provider-id: pkcs11
      module-path: ${YCSOPEN_PKCS11_MODULE_PATH:}
      allowed-module-paths: ${YCSOPEN_PKCS11_ALLOWED_MODULE_PATHS:}
      slot-id: ${YCSOPEN_PKCS11_SLOT_ID:-1}
      token-identity: ${YCSOPEN_PKCS11_TOKEN_IDENTITY:}
      credential-source: ENVIRONMENT
      credential-reference: ${YCSOPEN_PKCS11_CREDENTIAL_REFERENCE:YCSOPEN_PKCS11_PIN}
      mechanisms: CKM_AES_GCM,CKM_SHA256_HMAC
      key-attributes: CKA_TOKEN,CKA_PRIVATE,CKA_SENSITIVE,CKA_NOT_EXTRACTABLE
      rotation-required-at: 983040
      hard-ceiling: 1048576
      snapshot-store-root: ${YCSOPEN_ENCRYPTED_SNAPSHOT_STORE_ROOT:}
      aliases:
        field-encryption-kek: ycs.field-encryption-kek.v1
        snapshot-recovery: ycs.snapshot-recovery.v1
        mobile-blind-index: ycs.mobile-blind-index.v1
        object-capability-digest: ycs.object-capability-digest.v1
        registration-upload-digest: ycs.registration-upload-digest.v1
      references:
        snapshot-recovery: snapshot-recovery.v1
  routing:
    complaint-ratio-threshold: 0.003   # 千分之三 default, see PRD F-11.9/F-11.10
  third-party-blacklist:
    enabled: false
    base-url: ${THIRD_PARTY_BLACKLIST_URL:}
    app-id: ${THIRD_PARTY_BLACKLIST_APP_ID:}
    timeout-ms: 800
    fail-open: true   # F-5.3 超时降级策略：默认放行，避免外部依赖拖垮主链路

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
